spring.application.name=FEVeID

# Kết nối PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/FEVeID
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate/JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cổng chạy Spring Boot
server.port=8080

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT Configuration
# Khóa bí mật (Secret Key) - Phải là một chuỗi ngẫu nhiên, dài và phức tạp (ít nhất 256-bit)
app.jwt.secret=${JWT_SECRET}
# Thời gian sống của Token: 86400000 mili-giây (Tương đương 1 ngày)
app.jwt.expiration-milliseconds=86400000
# Cookie access_token chỉ gửi qua HTTPS. Chrome/Firefox coi http://localhost là an toàn nên dev vẫn chạy;
# trình duyệt nào không nhận thì đặt JWT_COOKIE_SECURE=false trong .env (chỉ ở máy dev)
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}
# Swagger UI tự đọc cookie XSRF-TOKEN và gửi header X-XSRF-TOKEN, nên gọi POST/PUT trong Swagger vẫn được
springdoc.swagger-ui.csrf.enabled=true
spring.config.import=optional:file:.env[.properties]